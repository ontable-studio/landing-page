# Headers that tell the browser what the page may and may not do. Included by
# every location in nginx.conf; copied to /etc/nginx/snippets/ by the Dockerfile.

# Only over https, for a year. Browsers ignore it over plain http, so it does no
# harm behind a proxy that ends the TLS. (No includeSubDomains and no preload:
# those are promises about the whole domain, to be made on purpose.)
add_header Strict-Transport-Security "max-age=31536000" always;

# A file is what its Content-Type says it is: the browser must not guess.
add_header X-Content-Type-Options "nosniff" always;

# Other sites may not put this one in a frame (clickjacking).
add_header X-Frame-Options "SAMEORIGIN" always;

# Another site sees only the address of this one, not the page, when a link is followed.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing here needs the camera, the microphone or the location.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
