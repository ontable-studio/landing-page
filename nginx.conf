server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	server_tokens off;
	absolute_redirect off;

	gzip on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_vary on;
	gzip_types
		text/css
		text/plain
		application/javascript
		application/json
		application/manifest+json
		application/xml
		image/svg+xml;

	# Everything in /assets is named after its contents, so it can be kept for good.
	# (Each location repeats the security headers: an add_header in a location
	# replaces the ones declared outside it, it does not add to them.)
	location /assets/ {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location /images/ {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "public, max-age=604800";
		try_files $uri =404;
	}

	# Unknown addresses get a real 404, not the home page (no "soft 404").
	location / {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ =404;
	}

	error_page 404 /404.html;
	location = /404.html {
		internal;
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-cache";
	}
}
